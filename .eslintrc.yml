root: true
env:
  browser: true
  es2020: true
  webextensions: true
parser: '@typescript-eslint/parser'
parserOptions:
  ecmaVersion: 2020
  sourceType: script
plugins:
  - '@typescript-eslint'
extends:
  - 'eslint:recommended'
  - 'plugin:@typescript-eslint/recommended'
ignorePatterns:
  - build/
  - dist/
  - node_modules/
  - scripts/
rules:
  indent:
    - error
    - 2
    - SwitchCase: 1
  linebreak-style:
    - error
    - unix
  quotes:
    - error
    - single
    - avoidEscape: true
  semi:
    - error
    - always
  max-len:
    - 1
    - code: 80
      ignoreStrings: true
      ignoreUrls: true
