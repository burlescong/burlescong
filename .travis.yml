language: node_js
dist: jammy
node_js:
  - "22"
script:
  - npm run lint
before_deploy:
  - >
    if ! [ "$BEFORE_DEPLOY_RUN" ]; then
      export BEFORE_DEPLOY_RUN=1;
      if [ -n "$CRX_PRIVATE_KEY" ]; then
        printf '%b\n' "$CRX_PRIVATE_KEY" > burlesco-pkcs8-key.pem ;
      elif [ -n "$encrypted_094982294358_key" ] && [ -n "$encrypted_094982294358_iv" ]; then
        openssl aes-256-cbc -K $encrypted_094982294358_key -iv $encrypted_094982294358_iv -in burlesco-pkcs8-key.pem.enc -out burlesco-pkcs8-key.pem -d ;
      else
        echo "missing CRX_PRIVATE_KEY (or encrypted pem)" ;
        travis_terminate 1 ;
      fi
      npm run build || travis_terminate 1;
      bash scripts/gen-gh-pages.sh || travis_terminate 1;
    fi
deploy:
  - provider: releases
    skip_cleanup: true
    token: $GITHUB_TOKEN
    file_glob: true
    file:
      - dist/chromium/burlesco-chromium.crx
      - dist/chromium/burlesco-chromium.zip
      - dist/firefox/*.xpi
      - dist/firefox/burlesco-firefox.zip
    on:
      branch: master
      tags: true
      repo: linneudm/burlesco
  - provider: pages
    skip_cleanup: true
    keep_history: true
    github_token: $GITHUB_TOKEN
    repo: linneudm/burlesco-update
    target_branch: master
    local_dir: gh-pages
    on:
      branch: master
      tags: true
      repo: linneudm/burlesco
